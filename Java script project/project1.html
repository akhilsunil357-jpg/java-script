<!DOCTYPE html>
<html lang="en">
<head>
    
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Result</title>

    <style>
    body{
        background-image: url("https://images.unsplash.com/photo-1518546305927-5a555bb7020d");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    </style>
</head>


<body class="vh-100 d-flex justify-content-center align-items-center">

    <div class="container text-center bg-white p-5 rounded shadow" style="max-width: 500px;">

        <h2 class="mb-4 ">🎉 Lottery Draw 🎉</h2>

        <button class="btn btn-primary" onclick="selectwinner()">Select Winner</button>

        <h3 id="result" class="mt-4 text-danger"></h3>

        <div class="modal fade" id="winnerModal">
            <div class="modal-dialog">
                <div class="modal-content text-center p-4">
                    <h4 id="modalresult"></h4>
                    <button class="btn btn-success mt-3" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>

    </div>


      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
      <script>

        const lotterynum=[101,205,309,412,587,690,777];

        function selectwinner(){

            let randomNum = Math.floor(Math.random() * lotterynum.length);
            let Winner = lotterynum[randomNum];


            console.log(`The Winner is ${Winner}`);

            document.getElementById("result").innerHTML=`Congratulation!! <br>The Winner is ${Winner}🎉`

            document.getElementById("modalresult").innerHTML=`Congratulation!! <br>The Winner is ${Winner}🎉`


            let myModal = new bootstrap.Modal(document.getElementById("winnerModal"));
            myModal.show();


            
            

        }



      </script>











</body>
</html>
