<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lottery Draw</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <!-- Center Container -->
  <div class="container text-center bg-white p-5 rounded shadow" style="max-width:500px;">

    <h2 class="mb-4">🎉 Lottery Draw 🎉</h2>

    <button class="btn btn-primary" onclick="selectWinner()">
      Select Winner
    </button>

    <h3 id="result" class="mt-4"></h3>

  </div>

  <!-- Bootstrap Modal -->
  <div class="modal fade" id="winnerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">🎊 Winner Announcement</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <h4 id="modalWinner"></h4>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const lotteryNumbers = [101, 205, 309, 412, 587, 690, 777];

    function selectWinner() {

      let randomIndex = Math.floor(Math.random() * lotteryNumbers.length);
      let winner = lotteryNumbers[randomIndex];

      // Console
      console.log("Winner is:", winner);

      // HTML
      let result = document.getElementById("result");
      result.innerHTML = "Winner is: " + winner;
      result.style.color = "red";

      // Modal
      document.getElementById("modalWinner").innerHTML = "Winner is: " + winner;
      let modal = new bootstrap.Modal(document.getElementById('winnerModal'));
      modal.show();
    }
  </script>

</body>
</html>
